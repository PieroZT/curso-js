<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button type="button" id="mensaje">Mensaje</button>
    <input type="text" id="caja" />

    <script>
      //Propiedad : caracteristica objetos (nombre, ubicacion, color)
      //Metodo    : acciones (verbo infinitivo)
      //Evento    : respuesta

      //E1: Al cargar la pagina...
      //DOM       : contenido de la pagina | Documento Object Model
      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM fue cargado completamente...");

        const boton = document.getElementById("mensaje");
        //E2: Clic(pulsar el boton)
        boton.addEventListener("click", function () {
          console.log("Hola mundo desde JS");
        });

        //¿Que significa addEventListener?
        //agrgar evento de escucha/atencion
        //E3: focus (enfoque)
        const contenido = document.getElementById("caja");
        contenido.addEventListener("focus", function () {
          console.log("Elemento activo a la caja");
        });
      });
    </script>
  </body>
</html>
